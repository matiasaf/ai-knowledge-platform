[project]
name = "ai-knowledge-platform-api"
version = "0.1.0"
description = "Evidence-first knowledge platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=6.12,<7",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_knowledge_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "ASYNC",
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",
    "F",
    "I",    # isort
    "N",    # pep8-naming
    "PTH",  # flake8-use-pathlib
    "RUF",
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
# Uploads are streamed to local disk in bounded chunks. Offloading each filesystem
# call to a worker thread would add more complexity than the sub-millisecond blocking
# it removes, and cleanup-on-cancellation would need a shielded scope to stay correct.
# Revisit when ingestion moves off the request path or onto remote storage.
"src/ai_knowledge_platform/documents/storage.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Deprecation warnings from the framework are how upgrades announce themselves;
# failing on them keeps the upgrade cost visible instead of accumulating silently.
filterwarnings = ["error"]
